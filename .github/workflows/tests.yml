name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Install alignment tools for synthetic integration test
        run: sudo apt-get update && sudo apt-get install -y samtools minimap2
      - run: python -m unittest discover -s tests -v
        env:
          ASREPLAY_INTEGRATION_TOOLCHAIN: '1' 
      - run: as-replay --help
